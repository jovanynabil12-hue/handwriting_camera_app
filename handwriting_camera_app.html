<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الكتابة باليدين من الكاميرا</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #drawCanvas { z-index: 2; }
    #uiCanvas { z-index: 3; pointer-events: none; }

    #toolbar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      max-width: calc(100vw - 28px);
    }

    button,
    input[type="color"],
    input[type="range"],
    select {
      cursor: pointer;
    }

    button,
    select {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      color: white;
      background: #222;
      font-size: 15px;
      font-weight: bold;
    }

    #clearBtn { background: #e53935; }

    #modeBox {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 5;
      background: rgba(0, 0, 0, 0.65);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.8;
      backdrop-filter: blur(10px);
      width: 420px;
      max-width: calc(100vw - 28px);
    }

    #dataBox {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 5;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.65;
      width: 420px;
      max-width: calc(100vw - 28px);
      direction: ltr;
      text-align: left;
      backdrop-filter: blur(10px);
    }

    .label { font-size: 14px; opacity: 0.9; }
    .green { color: #00ff88; }
    .yellow { color: #ffd54f; }
    .red { color: #ff6b6b; }
    .cyan { color: #4dd0e1; }
  </style>
</head>

<body>
  <div id="app">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="drawCanvas"></canvas>
    <canvas id="uiCanvas"></canvas>

    <div id="toolbar">
      <button id="clearBtn">مسح الكلام</button>
      <span class="label">اللون</span>
      <input id="colorPicker" type="color" value="#00ff88" />
      <span class="label">السمك</span>
      <input id="sizePicker" type="range" min="3" max="24" value="8" />
      <span class="label">الدقة</span>
      <select id="precisionSelect">
        <option value="balanced">متوازن</option>
        <option value="high" selected>دقيق جدًا</option>
        <option value="ultra">أعلى دقة</option>
      </select>
      <select id="modeSelect">
        <option value="easy">وضع سهل</option>
        <option value="strict" selected>وضع دقيق</option>
      </select>
    </div>

    <div id="modeBox">
      <b>طريقة الاستخدام</b><br>
      ارفع السبابة فقط للكتابة.<br>
      قرّب السبابة من الإبهام لتحريك الكلام.<br>
      افتح كفك بالكامل لمسح الكلام كله.<br>
      اقفل كفك بالكامل لإيقاف الكتابة.<br>
      أسفل الشاشة هتلاقي بيانات اليد لحظة بلحظة.
    </div>

    <div id="dataBox">Waiting for hands data...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <script>
    const video = document.getElementById("video");
    const drawCanvas = document.getElementById("drawCanvas");
    const uiCanvas = document.getElementById("uiCanvas");
    const drawCtx = drawCanvas.getContext("2d");
    const uiCtx = uiCanvas.getContext("2d");

    const clearBtn = document.getElementById("clearBtn");
    const colorPicker = document.getElementById("colorPicker");
    const sizePicker = document.getElementById("sizePicker");
    const modeSelect = document.getElementById("modeSelect");
    const precisionSelect = document.getElementById("precisionSelect");
    const dataBox = document.getElementById("dataBox");

    let strokes = [];
    let currentStroke = null;
    let drawingOffset = { x: 0, y: 0 };
    let moveStart = null;
    let baseOffset = { x: 0, y: 0 };
    let lastPoint = null;
    let smoothedPoint = null;
    let previousRawPoint = null;
    let gestureMemory = [];
    let lastClearTime = 0;
    

    

    function getPrecisionSettings() {
      const value = precisionSelect.value;
      if (value === "balanced") return { smooth: 0.50, minDist: 2.2, confidence: 0.60 };
      if (value === "high") return { smooth: 0.32, minDist: 1.6, confidence: 0.72 };
      return { smooth: 0.22, minDist: 1.1, confidence: 0.82 };
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      drawCanvas.width = Math.floor(window.innerWidth * dpr);
      drawCanvas.height = Math.floor(window.innerHeight * dpr);
      uiCanvas.width = Math.floor(window.innerWidth * dpr);
      uiCanvas.height = Math.floor(window.innerHeight * dpr);
      drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      uiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redrawAll();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    clearBtn.addEventListener("click", clearAll);

    function clearAll() {
      strokes = [];
      currentStroke = null;
      drawingOffset = { x: 0, y: 0 };
      moveStart = null;
      lastPoint = null;
      smoothedPoint = null;
      previousRawPoint = null;
      redrawAll();
    }

    function distance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function isFingerUp(landmarks, tip, pip, wrist) {
      const fingerLength = Math.abs(landmarks[pip].y - landmarks[wrist].y) + 0.001;
      const threshold = Math.max(0.010, fingerLength * 0.07);
      return landmarks[tip].y < landmarks[pip].y - threshold;
    }

    function getFingerData(landmarks) {
      return {
        thumb: landmarks[4].x < landmarks[3].x,
        index: isFingerUp(landmarks, 8, 6, 0),
        middle: isFingerUp(landmarks, 12, 10, 0),
        ring: isFingerUp(landmarks, 16, 14, 0),
        pinky: isFingerUp(landmarks, 20, 18, 0)
      };
    }

    function countFingers(f) {
      return [f.thumb, f.index, f.middle, f.ring, f.pinky].filter(Boolean).length;
    }

    function stableGesture(nextGesture) {
      gestureMemory.push(nextGesture);
      if (gestureMemory.length > 4) gestureMemory.shift();

      const counts = {};
      for (const g of gestureMemory) counts[g] = (counts[g] || 0) + 1;

      return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
    }

    function getGesture(landmarks) {
      const f = getFingerData(landmarks);
      const mode = modeSelect.value;

      const thumbTip = landmarkToScreen(landmarks[4]);
      const indexTip = landmarkToScreen(landmarks[8]);
      const pinchDistance = distance(thumbTip, indexTip);

      const openPalm = f.thumb && f.index && f.middle && f.ring && f.pinky;
      const closedPalm = !f.index && !f.middle && !f.ring && !f.pinky;

      if (openPalm) return "clear";

      if (f.index && pinchDistance < 55) return "move";

      if (mode === "easy") {
        if (f.index && !f.middle) return "draw";
      }

      if (mode === "strict") {
        if (f.index && !f.middle && !f.ring && !f.pinky) return "draw";
      }

      if (closedPalm) return "stop";

      return "idle";
    }

    function landmarkToScreen(point) {
      return {
        x: (1 - point.x) * window.innerWidth,
        y: point.y * window.innerHeight
      };
    }

    function predictPoint(point) {
      if (!previousRawPoint) {
        previousRawPoint = point;
        return point;
      }

      const vx = point.x - previousRawPoint.x;
      const vy = point.y - previousRawPoint.y;
      previousRawPoint = point;

      return {
        x: point.x + vx * 0.25,
        y: point.y + vy * 0.25
      };
    }

    function smoothPoint(point) {
      const settings = getPrecisionSettings();
      const predicted = predictPoint(point);

      if (!smoothedPoint) {
        smoothedPoint = predicted;
        return predicted;
      }

      smoothedPoint = {
        x: smoothedPoint.x + (predicted.x - smoothedPoint.x) * settings.smooth,
        y: smoothedPoint.y + (predicted.y - smoothedPoint.y) * settings.smooth
      };

      return smoothedPoint;
    }

    function startStroke(point) {
      currentStroke = {
        color: colorPicker.value,
        size: Number(sizePicker.value),
        points: [point]
      };
      strokes.push(currentStroke);
      lastPoint = point;
    }

    function addPoint(point) {
      const settings = getPrecisionSettings();

      if (!currentStroke) {
        startStroke(point);
        return;
      }

      if (!lastPoint || distance(point, lastPoint) >= settings.minDist) {
        currentStroke.points.push(point);
        lastPoint = point;
      }
    }

    function stopStroke() {
      currentStroke = null;
      lastPoint = null;
      smoothedPoint = null;
      previousRawPoint = null;
    }

    function drawStroke(stroke) {
      if (!stroke.points.length) return;

      drawCtx.save();
      drawCtx.translate(drawingOffset.x, drawingOffset.y);
      drawCtx.lineCap = "round";
      drawCtx.lineJoin = "round";
      drawCtx.strokeStyle = stroke.color;
      drawCtx.lineWidth = stroke.size;
      drawCtx.shadowBlur = 18;
      drawCtx.shadowColor = stroke.color;

      drawCtx.beginPath();
      drawCtx.lineWidth = stroke.size + 10;
      drawCtx.strokeStyle = stroke.color + "55";
      drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);

      if (stroke.points.length > 1) {
        for (let i = 1; i < stroke.points.length - 2; i++) {
          const c = stroke.points[i];
          const n = stroke.points[i + 1];
          const midX = (c.x + n.x) / 2;
          const midY = (c.y + n.y) / 2;
          drawCtx.quadraticCurveTo(c.x, c.y, midX, midY);
        }
        const glowLast = stroke.points[stroke.points.length - 1];
        drawCtx.lineTo(glowLast.x, glowLast.y);
        drawCtx.stroke();
      }

      drawCtx.shadowBlur = 8;
      drawCtx.shadowColor = "#ffffff";

      drawCtx.beginPath();
      drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);

      if (stroke.points.length === 1) {
        drawCtx.arc(stroke.points[0].x, stroke.points[0].y, stroke.size / 2, 0, Math.PI * 2);
        drawCtx.fillStyle = stroke.color;
        drawCtx.fill();
        drawCtx.restore();
        return;
      }

      for (let i = 1; i < stroke.points.length - 2; i++) {
        const c = stroke.points[i];
        const n = stroke.points[i + 1];
        const midX = (c.x + n.x) / 2;
        const midY = (c.y + n.y) / 2;
        drawCtx.quadraticCurveTo(c.x, c.y, midX, midY);
      }

      const last = stroke.points[stroke.points.length - 1];
      drawCtx.lineTo(last.x, last.y);
      drawCtx.stroke();

      if (stroke.points.length > 1) {
        drawCtx.globalAlpha = 0.75;
        drawCtx.shadowBlur = 0;
        drawCtx.strokeStyle = "rgba(255,255,255,0.85)";
        drawCtx.lineWidth = Math.max(1.2, stroke.size * 0.22);
        drawCtx.beginPath();
        drawCtx.moveTo(stroke.points[0].x, stroke.points[0].y);

        for (let i = 1; i < stroke.points.length - 2; i++) {
          const c = stroke.points[i];
          const n = stroke.points[i + 1];
          const midX = (c.x + n.x) / 2;
          const midY = (c.y + n.y) / 2;
          drawCtx.quadraticCurveTo(c.x, c.y, midX, midY);
        }

        const shineLast = stroke.points[stroke.points.length - 1];
        drawCtx.lineTo(shineLast.x, shineLast.y);
        drawCtx.stroke();
        drawCtx.globalAlpha = 1;
      }

      drawCtx.restore();
    }

    function redrawAll() {
      drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const stroke of strokes) drawStroke(stroke);
    }

    function drawHandSkeleton(landmarks, role, gesture) {
      const pairs = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
      ];

      let strokeColor = role === "write" ? "rgba(0,255,136,0.75)" : "rgba(77,208,225,0.75)";
      if (gesture === "move") strokeColor = "rgba(255,213,79,0.85)";
      if (gesture === "clear_ready") strokeColor = "rgba(255,107,107,0.95)";

      uiCtx.lineWidth = 2;
      uiCtx.strokeStyle = strokeColor;

      for (const [a, b] of pairs) {
        const p1 = landmarkToScreen(landmarks[a]);
        const p2 = landmarkToScreen(landmarks[b]);
        uiCtx.beginPath();
        uiCtx.moveTo(p1.x, p1.y);
        uiCtx.lineTo(p2.x, p2.y);
        uiCtx.stroke();
      }

      for (let i = 0; i < landmarks.length; i++) {
        const p = landmarkToScreen(landmarks[i]);
        uiCtx.beginPath();
        uiCtx.arc(p.x, p.y, i === 8 ? 7 : 4, 0, Math.PI * 2);
        uiCtx.fillStyle = i === 8 ? strokeColor : "rgba(255,255,255,0.8)";
        uiCtx.fill();
      }
    }

    function drawPointer(point, gesture) {
      let color = "rgba(255,255,255,0.9)";
      if (gesture === "draw") color = colorPicker.value;
      if (gesture === "move") color = "#ffd54f";

      uiCtx.beginPath();
      uiCtx.arc(point.x, point.y, gesture === "move" ? 20 : 12, 0, Math.PI * 2);
      uiCtx.fillStyle = color;
      uiCtx.fill();

      uiCtx.beginPath();
      uiCtx.arc(point.x, point.y, gesture === "move" ? 38 : 24, 0, Math.PI * 2);
      uiCtx.strokeStyle = color;
      uiCtx.lineWidth = 3;
      uiCtx.stroke();
    }

    function chooseHands(results) {
      const landmarksList = results.multiHandLandmarks || [];
      const handednessList = results.multiHandedness || [];
      const hands = [];

      for (let i = 0; i < landmarksList.length; i++) {
        const rawLabel = handednessList[i]?.label || "Unknown";
        const mirroredLabel = rawLabel === "Left" ? "Right" : rawLabel === "Right" ? "Left" : "Unknown";
        hands.push({
          landmarks: landmarksList[i],
          label: mirroredLabel,
          rawLabel,
          score: handednessList[i]?.score || 0,
          indexPoint: landmarkToScreen(landmarksList[i][8])
        });
      }

      let writeHand = hands.find(h => h.label === "Right") || hands[0] || null;
      let controlHand = hands.find(h => h !== writeHand) || null;

      return { hands, writeHand, controlHand };
    }

    

    function updateDataBox(handsCount, writeHand, writeGesture, point) {
      const writeF = writeHand ? getFingerData(writeHand.landmarks) : null;

      const statusClass = writeGesture === "draw"
        ? "green"
        : writeGesture === "move"
        ? "yellow"
        : writeGesture === "clear"
        ? "red"
        : "cyan";

      dataBox.innerHTML = `
        <div>Hands detected: <span class="green">${handsCount}</span></div>
        <div>Gesture: <span class="${statusClass}">${writeGesture.toUpperCase()}</span></div>
        <div>Move gesture: thumb + index pinch</div>
        <div>Pointer X: ${point ? Math.round(point.x) : "-"} | Y: ${point ? Math.round(point.y) : "-"}</div>
        <div>Thumb:${writeF?.thumb} Index:${writeF?.index} Middle:${writeF?.middle} Ring:${writeF?.ring} Pinky:${writeF?.pinky}</div>
        <div>Strokes: ${strokes.length}</div>
      `;
    }

    function onResults(results) {
      uiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      const { hands, writeHand } = chooseHands(results);

      if (!writeHand) {
        stopStroke();
        moveStart = null;
        dataBox.innerHTML = `<span class="red">No hand detected</span><br>قرّب إيدك من الكاميرا وحسن الإضاءة.`;
        return;
      }

      

      const rawGesture = getGesture(writeHand.landmarks);
      const gesture = stableGesture(rawGesture);
      const rawPoint = landmarkToScreen(writeHand.landmarks[8]);
      const point = smoothPoint(rawPoint);

      drawHandSkeleton(writeHand.landmarks, "write", gesture);
      drawPointer(point, gesture);
      updateDataBox(hands.length, writeHand, gesture, point);

      if (gesture === "clear") {
        clearAll();
        return;
      }

      if (gesture === "draw") {
        moveStart = null;
        addPoint(point);
        redrawAll();
        return;
      }

      if (gesture === "move") {
        stopStroke();

        if (!moveStart) {
          moveStart = point;
          baseOffset = { ...drawingOffset };
        }

        drawingOffset = {
          x: baseOffset.x + point.x - moveStart.x,
          y: baseOffset.y + point.y - moveStart.y
        };

        redrawAll();
        return;
      }

      if (gesture === "stop") {
        stopStroke();
        moveStart = null;
        return;
      }

      stopStroke();
      moveStart = null;
    }

    async function startApp() {
      const settings = getPrecisionSettings();

      const hands = new Hands({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: settings.confidence,
        minTrackingConfidence: settings.confidence
      });

      precisionSelect.addEventListener("change", () => {
        const s = getPrecisionSettings();
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: s.confidence,
          minTrackingConfidence: s.confidence
        });
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 1280,
        height: 720
      });

      camera.start();
    }

    startApp().catch(error => {
      dataBox.innerHTML = `<span class="red">Camera error</span><br>${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
